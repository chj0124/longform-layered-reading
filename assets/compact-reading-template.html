<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{color-scheme:light;--ink:#17211b;--muted:#5b665f;--line:#cbd5ce;--soft:#f2f5f2;--accent:#245c4c;--paper:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:880px;margin:auto;padding:28px 22px 56px}h1{font-size:clamp(26px,5vw,38px);line-height:1.25;margin:0 0 10px}h2{font-size:22px;line-height:1.4;margin:34px 0 12px}h3{font-size:17px;margin:20px 0 8px}p{margin:10px 0}.meta,.note{color:var(--muted);font-size:14px}.core{border-left:4px solid var(--accent);padding:8px 16px;background:var(--soft);margin:20px 0}.overview{padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px}.overview li{border-bottom:1px solid var(--line);padding:6px 0}.step{border-top:1px solid var(--line);padding:16px 0}.step h2{margin-top:0}.bridge{padding:12px 16px;background:var(--soft);border-radius:6px}.bridge strong{color:var(--accent)}details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:650;min-height:44px;display:flex;align-items:center}details[open] summary{color:var(--accent)}details>div{padding:0 0 8px 18px}a{color:#245c4c;text-underline-offset:3px}nav a{display:inline-flex;align-items:center;min-height:24px}:focus-visible{outline:3px solid #9a5b00;outline-offset:4px}footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;color:var(--muted);font-size:14px}
@media(max-width:560px){main{padding:20px 16px 40px}.overview{grid-template-columns:1fr}.bridge{padding:10px 12px}details>div{padding-left:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main id="main" data-main-reading-path>
<header>
<h1>%%TITLE%%</h1>
<p class="meta">%%SOURCE_AND_MODE%%</p>
<div class="core">%%CORE_CONCLUSION%%</div>
</header>
<nav aria-label="本文主线">
<ul class="overview">%%STRUCTURE_OVERVIEW%%</ul>
</nav>
<section class="step" id="section-1">
<h2>%%FIRST_SECTION_QUESTION%%</h2>
%%FIRST_MAIN_CONTENT%%
<details>
<summary>%%FIRST_DETAIL_SUMMARY%%</summary>
<div>%%FIRST_DETAIL_CONTENT%%</div>
</details>
</section>
%%MORE_MAIN_SECTIONS%%
</main>
<footer>
%%COVERAGE_AND_VALIDATION%%
<p><a href="#main">回到主线开头</a></p>
</footer>
</body>
</html>
